name: Build and publish docker image - nonprod

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  AWS_REGISTRY: 381492177008.dkr.ecr.us-east-1.amazonaws.com
  GH_REGISTRY: ghcr.io
  IMAGE_NAME: hdinonprod
  REGION: us-east-1

jobs:
  build_and_publish:
    name: Build and publish nonprod
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: create version file
        run: |
          echo ${{ github.ref_name }} > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull base image
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.GH_REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/hdiseguroscol/php-nginx-docker:v1.0.6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AWS_REGISTRY }}
          username: ${{ secrets.PRUEBAS_K }}
          password: ${{ secrets.PRUEBAS_A }}
          logout: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AWS_REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
